# Biweekly Architecture & Tech Debt Audit
#
# Runs /improve-codebase-architecture and /tech-debt-audit in a single
# Claude Code session. Skips scheduled runs when no relevant code/build files
# changed since the last audit tag, and also when that tag is younger than
# MIN_AUDIT_INTERVAL_DAYS: an audit run by hand (the tag is pushed with the
# same audit/YYYYMMDD-HHMMSS name) then stands in for the next scheduled one
# instead of being repeated a few days later. workflow_dispatch ignores the
# interval; force_run additionally ignores the change detection.
#
# The audit job runs on the same Windows image as the builds (this is a
# Windows-MSVC repo) with Git Bash as the step shell, and pre-provisions the
# build dependencies so the auditing Claude can compile projects and execute
# the test suites instead of reading blind, which a previous Linux-hosted
# audit could not do.
#
# Requirements:
#   1. Add CLAUDE_CODE_OAUTH_TOKEN under repository Actions secrets.
#   2. Set Actions workflow permissions to "Read and write permissions".
#   3. No audit skill is vendored. Each run installs the 115dkk-skills
#      plugin from the default branch of its marketplace, 115dkk/agent-skills
#      (public, so no token), and the prompt calls
#      /115dkk-skills:improve-codebase-architecture and
#      /115dkk-skills:tech-debt-audit. Like the CLI, it is deliberately
#      unpinned (the plugin manifest pins no version either) so the audit
#      runs what the maintainer uses; the issue body records the commit it
#      ran. Both skills are self-contained and model-invocable, so nothing
#      has to be unlocked before the session can run them.
#   4. RELEASE_DEPLOY_KEY, the write deploy key the version-bump job already
#      uses. TECH_DEBT_AUDIT.md is committed to main after every audit and
#      is the next audit's baseline: tech-debt-audit reads the file in the
#      repository root as the previous run, keeps its TD-NN IDs and lists
#      what was resolved since. The commit-baseline job pushes it over SSH
#      with this key, because main's "Required checks" ruleset lets only
#      deploy keys through and the commit has no checks of its own. The key
#      is never given to the audit job, where the Claude session has a shell.

name: Biweekly Audit

on:
  schedule:
    - cron: '0 9 1,15 * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if no relevant code changed'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  # A scheduled run this close to the newest audit/* tag is skipped. The
  # schedule fires on the 1st and 15th, so an out-of-band audit up to ten
  # days before a scheduled date replaces that date's run and the following
  # one (at least fourteen days later) still fires.
  MIN_AUDIT_INTERVAL_DAYS: 10

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_audit: ${{ steps.detect.outputs.should_audit }}
      last_audit_ref: ${{ steps.detect.outputs.last_audit_ref }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect code changes since last audit
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t code_pathspecs < .github/audit-pathspecs.txt

          if [ "${{ inputs.force_run }}" = "true" ]; then
            echo "Force run requested."
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
            echo "last_audit_ref=HEAD~50" >> "$GITHUB_OUTPUT"
            echo "changed_files_count=forced" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # By name, not by date: the name carries the audit time
          # (audit/YYYYMMDD-HHMMSS) and the tag is lightweight, so its
          # "creator date" is the date of whatever commit it points at - a
          # tag placed later on an older commit sorted behind older audits
          # (audit #348 TD-77).
          mapfile -t audit_tags < <(git tag -l 'audit/*' --sort=-refname)
          LAST_AUDIT="${audit_tags[0]:-}"

          if [ -z "$LAST_AUDIT" ]; then
            echo "Initial audit."
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
            echo "last_audit_ref=" >> "$GITHUB_OUTPUT"
            echo "changed_files_count=initial" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last audit: $LAST_AUDIT"
          echo "last_audit_ref=$LAST_AUDIT" >> "$GITHUB_OUTPUT"

          # The tag name carries the audit time (audit/YYYYMMDD-HHMMSS, UTC);
          # the tag is lightweight, so this is the only timestamp it has.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STAMP="${LAST_AUDIT#audit/}"
            if [[ "$STAMP" =~ ^([0-9]{8})-([0-9]{2})([0-9]{2})([0-9]{2})$ ]]; then
              LAST_EPOCH=$(date -u -d "${BASH_REMATCH[1]} ${BASH_REMATCH[2]}:${BASH_REMATCH[3]}:${BASH_REMATCH[4]}" +%s)
              AGE_DAYS=$(( ( $(date -u +%s) - LAST_EPOCH ) / 86400 ))
              echo "Last audit age: ${AGE_DAYS} day(s); minimum interval: ${MIN_AUDIT_INTERVAL_DAYS}."
              if [ "$AGE_DAYS" -lt "$MIN_AUDIT_INTERVAL_DAYS" ]; then
                echo "The last audit is too recent for a scheduled run. Skipping audit."
                echo "should_audit=false" >> "$GITHUB_OUTPUT"
                echo "changed_files_count=too-recent" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::warning::Audit tag '$LAST_AUDIT' does not carry a YYYYMMDD-HHMMSS stamp; the interval check is skipped."
            fi
          fi

          CODE_CHANGES=$(git diff --name-only "$LAST_AUDIT"..HEAD -- "${code_pathspecs[@]}" | wc -l | tr -d ' ')

          echo "Code files changed: $CODE_CHANGES"
          echo "changed_files_count=$CODE_CHANGES" >> "$GITHUB_OUTPUT"

          if [ "$CODE_CHANGES" -eq 0 ]; then
            echo "No relevant code changes. Skipping audit."
            echo "should_audit=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
          fi

  audit:
    needs: check-changes
    if: needs.check-changes.outputs.should_audit == 'true'
    # Same image as the build matrix: VS 2026 (v145), MSBuild, Python, Node.
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    defaults:
      run:
        # Git Bash, which is also what Claude Code's own shell tool uses on
        # Windows. All run steps below stay POSIX-shaped.
        shell: bash
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Install Claude Code
        # Deliberately unpinned, the one tool in the pipeline that is not
        # (maintainer decision on audit #348 TD-76): the audit should run on
        # the CLI the maintainer uses, and a stale pin would silently keep an
        # old model list and skill loader.
        run: npm install -g @anthropic-ai/claude-code

      # Give the auditing session a buildable tree: deps/ (FFTW, muparserx,
      # libsndfile, TCLAP, VST3, Highway, velopack_libc) and Qt, the same way a
      # developer would set up locally. Hash-verified per simd-variants.psd1.
      - name: Provision build dependencies
        shell: pwsh
        run: ./setup-build.ps1

      - name: Install audit skills
        id: skills
        run: |
          set -euo pipefail

          # Both audit skills come from the 115dkk-skills plugin, fetched
          # fresh on every run (requirement 3 in the header).
          claude plugin marketplace add 115dkk/agent-skills
          claude plugin install 115dkk-skills@115dkk
          PLUGIN_PATH=$(claude plugin list --json | jq -er '.[] | select(.id == "115dkk-skills@115dkk" and .enabled) | .installPath')
          # The CLI reports a Windows path; Git Bash wants its own form.
          PLUGIN_PATH=$(cygpath -u "$PLUGIN_PATH")

          # The prompt tells the model to run both skills, and it can only do
          # that through the Skill tool. A disable-model-invocation line
          # arriving with a plugin update would leave that part improvising
          # without its skill (the 2026-08-15 audit had to improvise Part 2
          # this way), so stop here instead.
          for skill in improve-codebase-architecture tech-debt-audit; do
            SKILL_MD="$PLUGIN_PATH/skills/$skill/SKILL.md"
            test -f "$SKILL_MD"
            if grep -q "^disable-model-invocation:" "$SKILL_MD"; then
              echo "::error::115dkk-skills:$skill carries disable-model-invocation, so the audit cannot invoke it."
              exit 1
            fi
          done

          PLUGIN_SHA=$(jq -r '.plugins["115dkk-skills@115dkk"][0].gitCommitSha // "unknown"' \
            "$HOME/.claude/plugins/installed_plugins.json" 2>/dev/null || echo unknown)
          echo "plugin_ref=115dkk/agent-skills@${PLUGIN_SHA:0:12}" >> "$GITHUB_OUTPUT"

          echo "Installed audit skills from 115dkk/agent-skills@${PLUGIN_SHA}:"
          find "$PLUGIN_PATH/skills" -maxdepth 2 -name SKILL.md -print

      - name: Verify Claude subscription credentials
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not configured."
            echo "Generate a subscription OAuth token with 'claude setup-token'."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "::warning::Ignoring ANTHROPIC_* credentials so Claude Code uses CLAUDE_CODE_OAUTH_TOKEN."
          fi

      - name: Generate change summary
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t code_pathspecs < .github/audit-pathspecs.txt

          LAST_REF="${{ needs.check-changes.outputs.last_audit_ref }}"
          if [ -n "$LAST_REF" ]; then
            echo "## Changed files" > change-summary.txt
            echo "" >> change-summary.txt
            git diff --stat "$LAST_REF"..HEAD -- "${code_pathspecs[@]}" >> change-summary.txt 2>/dev/null || true
          else
            echo "Initial audit run." > change-summary.txt
          fi

      - name: Run combined audit
        run: |
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN

          # TECH_DEBT_AUDIT.md in the checkout is the previous audit, which
          # the commit-baseline job committed (requirement 4). The skill reads
          # it as its baseline and overwrites it, so remember its blob: a
          # session that never writes a new report must not pass on the old
          # file.
          BASELINE_BLOB=$(git hash-object TECH_DEBT_AUDIT.md 2>/dev/null || echo none)

          # The audit runs on Mythos 5.1 (#337 pinned it to Fable 5.1, whose
          # safety classifiers could silently re-run a flagged request on
          # Opus 4.8 and keep the session there). availableModels stays
          # restricted to the audit model so the session can never drift
          # to another model: anything that would switch models ends with
          # an explicit error instead, and no tokens are spent elsewhere.
          # See code.claude.com/docs/en/model-config, "Automatic model
          # fallback" and "Restrict model selection". Availability-based
          # fallback is opt-in (--fallback-model) and stays unset.
          set +e
          claude \
            --model claude-mythos-5-1 \
            --effort xhigh \
            --settings '{"availableModels": ["claude-mythos-5-1"]}' \
            --permission-mode auto \
            --max-turns 100 \
            -p "
          You will perform two analyses in sequence within this
          single session. Each part writes its deliverable to its own
          Markdown file in the repository root (do not commit them).
          Print only a short completion summary to stdout: in this
          non-interactive session only the final message reaches
          stdout, so anything not written to a file is lost.

          ENVIRONMENT:
          - You are on a Windows runner (the same image CI builds on) with
            Visual Studio 2026 (v145), MSBuild on PATH, and Git Bash as your
            shell.
          - Build dependencies are pre-provisioned: deps/ holds FFTW,
            muparserx, libsndfile, TCLAP, the VST3 pluginterfaces, Highway,
            and velopack_libc; Qt is at Qt/6.12.0/msvc2022_64. CLAUDE.md
            documents the exact MSBuild/qmake commands and the PATH setup the
            test executables need.
          - You MAY compile projects and run the test suites
            (EditorLogicTests, HybridConvTests, EngineOrchestrationTests,
            AudioRegressionTests) to verify findings empirically. Prefer
            targeted project builds over full-solution builds; do not let
            build experiments crowd out the analysis itself.

          GLOBAL RULES:
          - Completely ignore all .ipynb files.
          - Treat docs/, Wiki/, image assets, fonts, compiled translations,
            and audio reference blobs as out of scope unless they expose a
            code or build-system issue.
          - Focus on the C++ audio engine, Qt GUI, tests, build scripts,
            release automation, and project configuration.
          - Cite file paths for every finding.
          - Do not suggest full rewrites.
          - Do not pad categories with filler findings.

          PART 1: Architecture Analysis
          Run /115dkk-skills:improve-codebase-architecture.
          This is an existing codebase, so use its review report, not
          the foundation or stack report. The skill carries its own
          glossary (module, interface, depth, seam, adapter, leverage,
          locality) and its principles, including the deletion test,
          in its LANGUAGE.md. Phrase every candidate in those exact
          terms rather than drifting into component, service, API, or
          boundary.
          Identify specific consolidation and deepening opportunities.
          Instead of the skill's HTML report, write the full
          deliverable as Markdown to ARCHITECTURE_AUDIT.md in the
          repository root: every candidate with files, problem,
          solution, benefits, and recommendation strength, plus the
          closing top recommendation. Do not write to the OS temp
          directory and do not open a browser.
          Stop there. The skill's step 3 is a grilling loop that asks
          the user which candidate to pursue, and this session has no
          user, so do not ask and do not let that step's side effects
          happen: leave CONTEXT.md and docs/adr/ untouched.
          When the file is complete, proceed immediately to Part 2.

          PART 2: Tech Debt Audit
          Run /115dkk-skills:tech-debt-audit.
          TECH_DEBT_AUDIT.md in the repository root, when present, is
          the previous audit, committed by this workflow: read it as
          the skill's baseline. Write the new deliverable over it as
          the skill specifies, with severity, effort estimates, and
          its 'looks bad but is fine' section.
          " > combined-audit-report.md 2>&1
          CLAUDE_EXIT=$?
          set -e

          if [ ! -s combined-audit-report.md ]; then
            echo "Audit produced no output." > combined-audit-report.md
            cat combined-audit-report.md
            exit 1
          fi

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "Claude audit failed with exit code $CLAUDE_EXIT."
            cat combined-audit-report.md
            exit "$CLAUDE_EXIT"
          fi

          # -p prints only the session's final message, so any part not
          # written to its own file never reaches the issue (the 2026-07-03
          # run lost Part 1 this way). Both deliverables are therefore
          # files, and a missing one is a hard failure, not a quiet gap.
          for deliverable in ARCHITECTURE_AUDIT.md TECH_DEBT_AUDIT.md; do
            if [ ! -s "$deliverable" ]; then
              echo "::error::The audit session did not produce ${deliverable}."
              cat combined-audit-report.md
              exit 1
            fi
          done

          if [ "$(git hash-object TECH_DEBT_AUDIT.md)" = "$BASELINE_BLOB" ]; then
            echo "::error::The audit session left the baseline TECH_DEBT_AUDIT.md unchanged."
            cat combined-audit-report.md
            exit 1
          fi

      - name: Create GitHub Issue or summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          COUNT="${{ needs.check-changes.outputs.changed_files_count }}"

          {
            echo "# Biweekly Audit: ${DATE}"
            echo ""
            echo "Changed relevant files: **${COUNT}**"
            echo "Model: Mythos 5.1 - Effort: xhigh - 1M context"
            echo "Audit skills: 115dkk-skills (${{ steps.skills.outputs.plugin_ref }})"
            echo ""
            echo "This issue body corresponds to the generated \`issue-body.md\` artifact."
            echo "The remaining audit outputs are posted in full as file-specific comments below."
            echo ""
            echo "Files readable from this issue:"
            echo "- \`issue-body.md\` - this issue body"
            echo "- \`change-summary.txt\` - comments"
            echo "- \`ARCHITECTURE_AUDIT.md\` - comments (Part 1)"
            echo "- \`TECH_DEBT_AUDIT.md\` - comments (Part 2)"
            echo "- \`combined-audit-report.md\` - comments (session log)"
          } > issue-body.md

          post_file_comments() {
            local issue_number="$1"
            local file_path="$2"
            local title="$3"

            if [ ! -s "$file_path" ]; then
              echo "Skipping empty or missing file: $file_path"
              return 0
            fi

            local comment_dir
            comment_dir=$(mktemp -d)
            awk -v prefix="$comment_dir/part-" -v limit=18000 '
              BEGIN {
                part = 0
                size = 0
                file = sprintf("%s%04d", prefix, part)
              }
              {
                line = $0 ORS
                line_size = length(line)
                if (size > 0 && size + line_size > limit) {
                  close(file)
                  part++
                  file = sprintf("%s%04d", prefix, part)
                  size = 0
                }
                printf "%s", line >> file
                size += line_size
              }
            ' "$file_path"

            local total
            total=$(find "$comment_dir" -type f -name 'part-*' | wc -l | tr -d ' ')
            local index=1

            for part in "$comment_dir"/part-*; do
              {
                echo "## ${title} (${index}/${total})"
                echo ""
                echo "Source file: \`${file_path}\`"
                echo ""
                echo '````markdown'
                cat "$part"
                echo ""
                echo '````'
              } > "$comment_dir/comment.md"

              gh issue comment "$issue_number" \
                --repo "${GITHUB_REPOSITORY}" \
                --body-file "$comment_dir/comment.md"

              index=$((index + 1))
            done
          }

          gh label create audit \
            --repo "${GITHUB_REPOSITORY}" \
            --color "5319e7" \
            --description "Architecture and tech debt audit" \
            >/dev/null 2>&1 || true

          gh label create maintenance \
            --repo "${GITHUB_REPOSITORY}" \
            --color "fbca04" \
            --description "Maintenance work" \
            >/dev/null 2>&1 || true

          set +e
          ISSUE_ERROR=$(mktemp)
          ISSUE_URL=$(gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Biweekly Audit: ${DATE}" \
            --body-file issue-body.md \
            --label audit \
            --label maintenance 2>"${ISSUE_ERROR}")
          ISSUE_EXIT=$?
          set -e

          if [ "${ISSUE_EXIT}" -eq 0 ]; then
            echo "Created issue: ${ISSUE_URL}"
            ISSUE_NUMBER="${ISSUE_URL##*/}"

            post_file_comments "$ISSUE_NUMBER" change-summary.txt "Change summary"
            post_file_comments "$ISSUE_NUMBER" ARCHITECTURE_AUDIT.md "Architecture audit"
            post_file_comments "$ISSUE_NUMBER" TECH_DEBT_AUDIT.md "Tech debt audit"
            post_file_comments "$ISSUE_NUMBER" combined-audit-report.md "Audit session log"
          else
            echo "::warning::Could not create a GitHub issue. Writing the audit body to the job summary instead."
            cat "${ISSUE_ERROR}"
            {
              echo "## Biweekly Audit report"
              echo ""
              echo "GitHub issue creation failed:"
              echo '```'
              cat "${ISSUE_ERROR}"
              echo '```'
              echo ""
              cat issue-body.md
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "audit-report-${{ github.run_id }}"
          path: |
            combined-audit-report.md
            change-summary.txt
            ARCHITECTURE_AUDIT.md
            TECH_DEBT_AUDIT.md
            issue-body.md
          retention-days: 90

      - name: Tag audit checkpoint
        run: |
          AUDIT_TAG="audit/$(date +%Y%m%d-%H%M%S)"
          git tag "$AUDIT_TAG"
          git push origin "$AUDIT_TAG"
          echo "Tagged: $AUDIT_TAG"

  commit-baseline:
    # Commits this run's TECH_DEBT_AUDIT.md to main as the next audit's
    # baseline (requirement 4 in the header). It runs only after the audit
    # job finished, deliverables checked, issue filed and checkpoint tagged.
    needs: audit
    # An audit dispatched on another branch is not main's baseline, and
    # checking that branch out here would rebase its unmerged commits onto
    # main and push them with the deploy key. Only a run on main commits, and
    # the checkout is pinned to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The push authenticates with the RELEASE_DEPLOY_KEY deploy key, so the
    # token only needs to read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          # Full history, so the rebase onto a main that moved meanwhile has
          # its merge base.
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: "audit-report-${{ github.run_id }}"
          path: ${{ runner.temp }}/audit-report

      - name: Commit TECH_DEBT_AUDIT.md as the next baseline
        run: |
          set -euo pipefail

          cp "$RUNNER_TEMP/audit-report/TECH_DEBT_AUDIT.md" TECH_DEBT_AUDIT.md
          if git ls-files --error-unmatch TECH_DEBT_AUDIT.md >/dev/null 2>&1 \
            && git diff --quiet -- TECH_DEBT_AUDIT.md; then
            echo "TECH_DEBT_AUDIT.md is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TECH_DEBT_AUDIT.md
          # [skip ci] keeps the deploy-key push from starting the build
          # workflow on a commit that only touches this report. The audit's
          # own change detection ignores *.md, so it does not trigger the
          # next audit either.
          git commit -m "docs: 기술 부채 감사 기준 결과를 갱신 [skip ci]" \
            -m "격주 감사(실행 ${{ github.run_id }})의 TECH_DEBT_AUDIT.md를 다음 감사의 기준 결과로 커밋합니다."

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase FETCH_HEAD && git push origin HEAD:main; then
              echo "Committed the baseline as $(git rev-parse HEAD)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Baseline push attempt ${attempt} failed; retrying."
            sleep 5
          done
          echo "::error::Could not push TECH_DEBT_AUDIT.md to main after 3 attempts."
          exit 1
