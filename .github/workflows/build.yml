name: Build EqualizerAPO

on:
  push:
    branches: [ main, SIMD_CI ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      regenerate_references:
        # Audit #275 TD-08: seeding used to switch on the mere absence of
        # references/cases.json, so deleting or renaming the reference set
        # silently turned the verify gate into a re-record. Seeding is now an
        # explicit, logged decision; see
        # Tests/AudioRegressionTests/references/README.md before using it.
        description: 'Re-record AudioRegressionTests references instead of verifying against them'
        type: boolean
        default: false

# Serialize runs per ref. On main this queues release pipelines so two quick
# merges can't both try to create the same release (which raced to a 403 on the
# GitHub releases API). On pull requests a new push cancels the stale run for
# faster feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write
  packages: write
  artifact-metadata: write

env:
  BUILD_CONFIGURATION: Release

jobs:
  version-bump:
    # Run on every main push EXCEPT:
    #   • pushes the bump job itself made — those carry [skip ci] which already
    #     stops GitHub from triggering a new workflow, but we guard explicitly
    #     in case that behaviour ever changes.
    #   • manual `chore(version):` commits — when a maintainer sets a specific
    #     version we keep their value and just build/release with it.
    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, '[skip ci]')
      && !startsWith(github.event.head_commit.message, 'chore(version):')
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    outputs:
      bumped_sha: ${{ steps.commit.outputs.sha }}
      base_version: ${{ steps.commit.outputs.base_version }}
      # 'true' when this push raised version.h. When it stays 'false' the push
      # cannot produce a new release (the tag already exists), so the build
      # matrix and release jobs are skipped entirely. Use workflow_dispatch to
      # force a full-matrix build of such a push when needed.
      bumped: ${{ steps.commit.outputs.bumped }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        # Persist the credentials so the bump push uses GITHUB_TOKEN as expected.
        # Note: GITHUB_TOKEN pushes do NOT retrigger workflows, which is why we
        # do the build/release in the same workflow run (downstream jobs check
        # out bumped_sha).
        persist-credentials: true

    - name: Bump version
      shell: pwsh
      run: .\.github\scripts\Bump-Version.ps1

    - name: Commit and read version
      id: commit
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # Canonical version.h reader, shared with the create-release job.
        . .\.github\scripts\Get-VersionPart.ps1

        # version.h has already been bumped (or left as-is) by the previous
        # step; read the resulting version so the changelog and the job outputs
        # agree with it.
        $major = Get-VersionPart "MAJOR"
        $minor = Get-VersionPart "MINOR"
        $revision = Get-VersionPart "REVISION"
        $baseVersion = "$major.$minor.$revision"

        git diff --quiet -- version.h
        $diffExit = $LASTEXITCODE
        $global:LASTEXITCODE = 0

        if ($diffExit -eq 1) {
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # File the accumulated "## Unreleased" entries under the version being
          # cut, so the release ships with its own changelog section. A no-op
          # when Unreleased is empty; only reached on a real bump, so a
          # non-bumping push (docs/ci/chore/refactor) leaves the entries
          # accumulating for the next release - the manual convention this
          # automates (CLAUDE.md).
          $releaseDate = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          .\.github\scripts\Update-Changelog.ps1 -Version $baseVersion -Date $releaseDate
          git add version.h CHANGELOG.md CHANGELOG.ko.md
          # [skip ci] keeps any future GitHub change from triggering a second run on
          # this commit; the current workflow keeps going regardless.
          git commit -m "chore(version): bump version [skip ci]"
          git push
          "bumped=true" >> $env:GITHUB_OUTPUT
        }
        else {
          "bumped=false" >> $env:GITHUB_OUTPUT
          Write-Host "::notice::No version bump for this push, so no new release is possible. Skipping the build matrix; use workflow_dispatch to build it anyway."
        }

        $sha = (& git rev-parse HEAD).Trim()

        Write-Host "Bumped HEAD: $sha"
        Write-Host "Base version: $baseVersion"

        "sha=$sha" >> $env:GITHUB_OUTPUT
        "base_version=$baseVersion" >> $env:GITHUB_OUTPUT

  # The variant matrix is authored once in .github/simd-variants.psd1 and expanded
  # here, so adding or renaming a variant cannot silently diverge between the
  # manifest, this matrix, the installer, and the release tooling. The same job
  # lints the channel strings compiled into Installer/AutoInstaller.cpp against
  # the manifest, and the engine source list Editor.pro keeps in step with
  # Common.vcxproj. Both drifts otherwise surface only inside a matrix leg, and
  # the source-list one only at the Editor link step twenty minutes in.
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      # JSON array of the x64 variants hosted runners can execute at runtime
      # (Platform x64 + RunnerCanExecute in the manifest). Consumed by the
      # cross-variant-compare job so its gating list cannot drift from the
      # manifest.
      runner_executable_variants: ${{ steps.gen.outputs.runner_executable_variants }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Lint variant consumers against the manifest
      shell: pwsh
      run: ./.github/scripts/Test-VariantSync.ps1

    - name: Lint the Editor's engine source list against Common.vcxproj
      shell: pwsh
      run: ./.github/scripts/Test-SourceSync.ps1

    - name: Verify skin module boundaries
      shell: pwsh
      run: ./.github/scripts/Test-SkinModules.ps1

    - name: Generate build matrix from the manifest
      id: gen
      shell: pwsh
      run: ./.github/scripts/New-BuildMatrix.ps1 -EventName "${{ github.event_name }}"

  build:
    needs: [version-bump, prepare-matrix]
    # Build for PRs, dispatches, and version-bumping main pushes. On main the
    # bump job must finish first so the build picks up the bumped version.h;
    # when it decides nothing bumps (docs/ci/chore/refactor-only pushes) the
    # push cannot produce a new release, so the whole matrix is skipped. A
    # skipped bump job on main means a manual `chore(version):` commit — the
    # maintainer set a version by hand, so build it. On every other event the
    # bump job is skipped by its own `if` and we always build. Full-matrix
    # coverage for a no-bump push stays available via workflow_dispatch.
    if: |
      always() && needs.prepare-matrix.result == 'success' && (
        github.event_name != 'push' ||
        github.ref != 'refs/heads/main' ||
        needs.version-bump.result == 'skipped' ||
        (needs.version-bump.result == 'success' && needs.version-bump.outputs.bumped == 'true')
      )
    strategy:
      fail-fast: false
      # Authored in .github/simd-variants.psd1, expanded by
      # .github/scripts/New-BuildMatrix.ps1. Pull requests build only the
      # Primary variant (avx2); pushes and manual dispatches build all six.
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        # On main, the bump job pushed a new commit using GITHUB_TOKEN which does
        # not retrigger workflows. Pulling that commit explicitly ensures the
        # build runs against the bumped version.h instead of the pre-bump SHA
        # that triggered the workflow.
        ref: ${{ needs.version-bump.outputs.bumped_sha || github.sha }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        # setup-msbuild compares this input CASE-SENSITIVELY against 'x64'/'arm64'
        # and silently falls back to the 32-bit x86 MSBuild on any other value.
        # matrix.platform is 'ARM64' (uppercase, the MSBuild $(Platform) name), so
        # passing it here handed the ARM64 leg an x86 MSBuild, which in turn always
        # selects the emulated 32-bit HostX86 cl.exe — the C3859/C1076 PCH
        # virtual-memory failures. matrix.msvcdevplatform carries the lowercase
        # host-architecture spelling ('x64'/'arm64') for exactly this purpose.
        msbuild-architecture: ${{ matrix.msvcdevplatform }}

    # Pinned dependency tags/versions live in .github/simd-variants.psd1 so they are
    # defined once and shared with setup-build.ps1. Export them as job env vars for the
    # checkout/download steps below (a typo'd tag would otherwise diverge silently).
    - name: Resolve pinned dependency tags
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $manifest = Import-PowerShellDataFile -Path "${{ github.workspace }}\.github\simd-variants.psd1"
        "VST3_TAG=$($manifest.Shared.Vst3Tag)" >> $env:GITHUB_ENV
        "HIGHWAY_TAG=$($manifest.Shared.HighwayTag)" >> $env:GITHUB_ENV
        "TCLAP_TAG=$($manifest.Shared.TclapTag)" >> $env:GITHUB_ENV
        Write-Host "VST3 tag: $($manifest.Shared.Vst3Tag)"
        Write-Host "Highway tag: $($manifest.Shared.HighwayTag)"
        Write-Host "TCLAP tag: $($manifest.Shared.TclapTag)"

    # Supply-chain pins: the prebuilt binary dependencies (and velopack_libc)
    # are downloaded from a pinned release tag and verified against the SHA-256
    # recorded in .github/simd-variants.psd1, so a new upload to those personal
    # forks cannot change what CI links without a reviewed manifest diff. The
    # download+verify loop lives in .github/scripts/Provisioning.psm1, shared
    # with setup-build.ps1 (TD015).
    - name: Download dependency release assets
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        Import-Module "${{ github.workspace }}\.github\scripts\Provisioning.psm1" -Force

        $manifest = Import-PowerShellDataFile -Path "${{ github.workspace }}\.github\simd-variants.psd1"
        $downloads = Get-DependencyDownloadSpec -Manifest $manifest `
          -DepsRoot "${{ github.workspace }}\deps" `
          -Platform "${{ matrix.platform }}" `
          -Simd "${{ matrix.simd_variant }}"
        Invoke-DependencyDownload -Downloads $downloads `
          -DownloadRoot "${{ github.workspace }}\deps\_downloads"

    # The vcpkg FFTW/libsndfile build and the muparserx /arch rebuild live in
    # .github/scripts/Provisioning.psm1, shared with setup-build.ps1 (TD015).
    - name: Build lower-SIMD dependency binaries
      if: ${{ matrix.uses_vcpkg == true }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # Canonical vswhere/VsDevCmd import, shared with the Qt build step below
        # and setup-build.ps1.
        . .\.github\scripts\Import-VsDevEnvironment.ps1
        Import-Module "${{ github.workspace }}\.github\scripts\Provisioning.psm1" -Force

        Import-VsDevEnvironment "${{ matrix.msvcdevplatform }}"

        $manifest = Import-PowerShellDataFile -Path "${{ github.workspace }}\.github\simd-variants.psd1"
        Build-VcpkgDependencies -DepsRoot "${{ github.workspace }}\deps" `
          -VcpkgFallbackRoot "${{ github.workspace }}\vcpkg" `
          -SimdVariant "${{ matrix.simd_variant }}" `
          -VcpkgCommit $manifest.Shared.VcpkgCommit

    # Clone tclap repository (header-only library). Pinned like the other source
    # dependencies; the tag comes from .github/simd-variants.psd1 (Shared.TclapTag).
    - name: Download TCLAP
      uses: actions/checkout@v6
      with:
        repository: 115dkk/tclap
        ref: ${{ env.TCLAP_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        path: deps/tclap

    # Clone the VST3 SDK pluginterfaces (header-only COM interfaces + IID unit).
    # Only this submodule is needed for VST3 hosting; public.sdk / vstgui are not
    # compiled. Pinned to the first MIT-licensed release; the exact tag comes from
    # .github/simd-variants.psd1 (Shared.Vst3Tag), shared with setup-build.ps1.
    - name: Download VST3 pluginterfaces
      uses: actions/checkout@v6
      with:
        repository: steinbergmedia/vst3_pluginterfaces
        ref: ${{ env.VST3_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        path: deps/vst3sdk/pluginterfaces

    # Clone Google Highway (header-only portable SIMD). The Common DSP kernels
    # use it in static per-target dispatch mode (one TU compiled per /arch), so
    # only the headers are needed; libhwy / the runtime dispatch table are not.
    # The exact tag comes from .github/simd-variants.psd1 (Shared.HighwayTag).
    - name: Download Highway
      uses: actions/checkout@v6
      with:
        repository: google/highway
        ref: ${{ env.HIGHWAY_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        path: deps/highway

    # Setup dependency structures
    - name: Setup dependency structures
      shell: pwsh
      run: |
        .\.github\scripts\Initialize-DepsEnvironment.ps1 -DepsPath "${{ github.workspace }}\deps"

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # Install Qt for Editor, DeviceSelector, and UpdateChecker. The aqt install
    # (concurrency 1: parallel extraction raced intermittently) lives in
    # .github/scripts/Provisioning.psm1, shared with setup-build.ps1 (TD015).
    - name: Install Qt
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        Import-Module "${{ github.workspace }}\.github\scripts\Provisioning.psm1" -Force

        $qtRoot = Install-QtSdk -WorkspaceRoot "${{ github.workspace }}" -Platform "${{ matrix.platform }}"

        echo "QT_ROOT=$qtRoot" >> $env:GITHUB_ENV
        echo "Qt6_DIR=$qtRoot" >> $env:GITHUB_ENV
        echo "$qtRoot\bin" >> $env:GITHUB_PATH
        Write-Host "QT_ROOT=$qtRoot"

    # Build the solution (excluding Qt VS Tools projects which will be built separately)
    - name: Build solution
      shell: pwsh
      run: |
        & "${{ github.workspace }}\.github\scripts\Build-Solution.ps1" `
          -WorkspaceRoot "${{ github.workspace }}" `
          -Platform "${{ matrix.platform }}" `
          -Configuration "${{ env.BUILD_CONFIGURATION }}" `
          -ArchFlag "${{ matrix.arch_flag }}" `
          -SimdVariant "${{ matrix.simd_variant }}" `
          -CanExecute:("${{ matrix.can_execute }}" -eq "true")



    - name: Run audio regression tests
      # AVX-512 and AVX10.1 binaries cannot be executed on GitHub-hosted
      # x64 runners; we still build them but skip the runtime test step.
      # The gate is the manifest's per-variant RunnerCanExecute flag.
      if: matrix.can_execute == true
      shell: pwsh
      run: |
        $variant = "${{ matrix.simd_variant }}"
        $platform = "${{ matrix.platform }}"
        $exe = "${{ github.workspace }}\Tests\AudioRegressionTests\$platform\Release\AudioRegressionTests.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "AudioRegressionTests executable not found at $exe"
          exit 1
        }

        $env:PATH = "$env:FFTW_LIB;$env:LIBSNDFILE_LIB;$env:MUPARSERX_LIB;$env:PATH"

        $repoRefDir = "${{ github.workspace }}\Tests\AudioRegressionTests\references"
        $hasRefs = Test-Path (Join-Path $repoRefDir "cases.json")
        # The primary (reference-seeding) variant is flagged in simd-variants.psd1.
        $isPrimary = "${{ matrix.primary }}" -eq "true"
        # Seeding is an explicit workflow_dispatch decision (audit #275 TD-08).
        # Empty on push/pull_request events, which therefore always verify.
        $regenerate = "${{ inputs.regenerate_references }}" -eq "true"

        Push-Location "${{ github.workspace }}\Tests\AudioRegressionTests"
        try {
          if ($regenerate) {
            if ($isPrimary) {
              Write-Host "::warning::regenerate_references was requested; primary variant '$variant' is RE-RECORDING the golden references instead of verifying against them. See Tests/AudioRegressionTests/references/README.md before committing the result."
            } else {
              Write-Host "::warning::regenerate_references was requested; recording variant output only (non-primary variant '$variant')"
            }
            & $exe --variant $variant --config-dir configs --ref-dir references --out-dir output --generate-references
            if ($LASTEXITCODE -ne 0) {
              Write-Error "AudioRegressionTests reference generation failed for variant '$variant'"
              exit $LASTEXITCODE
            }
          } else {
            if (-not $hasRefs) {
              # Never fall back to seeding implicitly: a deleted or renamed
              # reference set must fail the gate, not re-record it.
              Write-Error "references/cases.json is missing and regenerate_references was not requested. Restore the committed reference set, or dispatch the workflow with regenerate_references=true if re-recording is genuinely intended."
              exit 1
            }
            Write-Host "Running verify mode for variant '$variant'"
            & $exe --variant $variant --config-dir configs --ref-dir references --out-dir output
            if ($LASTEXITCODE -ne 0) {
              Write-Error "AudioRegressionTests verify failed for variant '$variant'"
              exit $LASTEXITCODE
            }
          }
        } finally {
          Pop-Location
        }

    - name: Upload audio regression outputs
      if: matrix.can_execute == true
      uses: actions/upload-artifact@v7
      with:
        name: audio-regression-output-${{ matrix.simd_variant }}
        path: Tests/AudioRegressionTests/output
        retention-days: 14
        if-no-files-found: warn

    - name: Upload audio regression references (primary variant)
      if: matrix.primary == true
      uses: actions/upload-artifact@v7
      with:
        name: audio-regression-references
        path: Tests/AudioRegressionTests/references
        retention-days: 30
        if-no-files-found: warn

    # Build Qt projects with qmake (Editor, DeviceSelector, UpdateChecker)
    - name: Build Qt Applications
      shell: pwsh
      run: |
        & "${{ github.workspace }}\.github\scripts\Build-QtApps.ps1" `
          -WorkspaceRoot "${{ github.workspace }}" `
          -Platform "${{ matrix.platform }}" `
          -SimdVariant "${{ matrix.simd_variant }}" `
          -QtArchFlag "${{ matrix.qt_arch_flag }}" `
          -MsvcDevPlatform "${{ matrix.msvcdevplatform }}" `
          -UpdateChannel "${{ matrix.channel }}"


    # The VSTPlugin store()/parse round-trip self-test: opening and saving a
    # line must never lose chunk data, parameters or the bus contract.
    # The six Editor offscreen gates share one headless preamble (velopack
    # SONAME copy, dependency PATH, QT_QPA offscreen setup with the platform-
    # plugin search pointed at the full Qt install, stderr capture for a
    # GUI-subsystem binary). It lived as six inline YAML copies; it now lives
    # once in .github/scripts/Invoke-EditorOffscreenTest.ps1 (audit #275
    # D6/TD-24), with -PlanOnly Pester coverage. Primary avx2 variant only:
    # the gates exercise QSS/QPainter/widget behavior, which does not vary by
    # SIMD variant.
    #
    # Gate notes (history lives with each gate's entry in the script):
    # - skin-gallery publishes the judging material for the skin program
    #   (issues #66-#68) and hard-fails on an empty run.
    # - skin-switch replays MainWindow::skinSelected's exact sequence over a
    #   100+ row config; both regression classes it guards (switch crashes,
    #   seconds-per-switch repolish storms) have shipped before.
    # - analysis-layout reproduces the right-dock placement at 1024x768 and
    #   the bottom/back relayout.
    # - card-move keeps the drag-move on the incremental splice path (a full
    #   rebuild costs 1.4-1.6 s per move on this runner and fails the gate).
    # - card-selection pins pointer-selection chrome across skins.
    - name: Run VST Editor self-test (offscreen)
      if: matrix.simd_variant == 'avx2'
      timeout-minutes: 3
      shell: pwsh
      run: |
        & .\.github\scripts\Invoke-EditorOffscreenTest.ps1 `
          -WorkspaceRoot "${{ github.workspace }}" -Gate selftest-vst

    # The header power toggle and the row-editor construction policy: every
    # valid line keeps a real editor through load and an off/on round trip
    # (the audit #275 B4 extraction silently turned every plain biquad row
    # into a collapsed raw fragment), and the toggle round-trips the text.
    - name: Run power toggle test (offscreen)
      if: matrix.simd_variant == 'avx2'
      timeout-minutes: 5
      shell: pwsh
      run: |
        & .\.github\scripts\Invoke-EditorOffscreenTest.ps1 `
          -WorkspaceRoot "${{ github.workspace }}" -Gate power-toggle

    # A hard step timeout on every gate: if the Editor ever blocks on a
    # fatal-error dialog again, the job must fail in minutes, not hang for
    # hours.
    - name: Run skin gallery (offscreen)
      if: matrix.simd_variant == 'avx2'
      timeout-minutes: 10
      shell: pwsh
      run: |
        & .\.github\scripts\Invoke-EditorOffscreenTest.ps1 `
          -WorkspaceRoot "${{ github.workspace }}" -Gate skin-gallery -Platform "${{ matrix.platform }}"

    - name: Run skin switch test (offscreen)
      if: matrix.simd_variant == 'avx2'
      timeout-minutes: 10
      shell: pwsh
      run: |
        & .\.github\scripts\Invoke-EditorOffscreenTest.ps1 `
          -WorkspaceRoot "${{ github.workspace }}" -Gate skin-switch

    - name: Run analysis dock layout test (offscreen)
      if: matrix.simd_variant == 'avx2'
      timeout-minutes: 5
      shell: pwsh
      run: |
        & .\.github\scripts\Invoke-EditorOffscreenTest.ps1 `
          -WorkspaceRoot "${{ github.workspace }}" -Gate analysis-layout

    - name: Run card move test (offscreen)
      if: matrix.simd_variant == 'avx2'
      timeout-minutes: 10
      shell: pwsh
      run: |
        & .\.github\scripts\Invoke-EditorOffscreenTest.ps1 `
          -WorkspaceRoot "${{ github.workspace }}" -Gate card-move

    - name: Run card selection test (offscreen)
      if: matrix.simd_variant == 'avx2'
      timeout-minutes: 5
      shell: pwsh
      run: |
        & .\.github\scripts\Invoke-EditorOffscreenTest.ps1 `
          -WorkspaceRoot "${{ github.workspace }}" -Gate card-selection

    - name: Upload skin gallery
      if: matrix.simd_variant == 'avx2'
      uses: actions/upload-artifact@v7
      with:
        name: skin-gallery
        path: skin-gallery/*.png

    - name: Upload analysis dock layout proof
      if: matrix.simd_variant == 'avx2'
      uses: actions/upload-artifact@v7
      with:
        name: analysis-layout
        path: analysis-layout/*

    - name: Upload card selection proof
      if: matrix.simd_variant == 'avx2'
      uses: actions/upload-artifact@v7
      with:
        name: card-selection
        path: card-selection/*

    # Pull the debug symbols out of the release dirs so the installers stay
    # lean, and keep them as a run artifact: field crash minidumps written by
    # the Editor's CrashHandler can only be symbolized against the PDB of the
    # exact shipped binary.
    - name: Collect debug symbols
      shell: pwsh
      run: |
        $symDir = "${{ github.workspace }}\symbols"
        New-Item -ItemType Directory -Force -Path $symDir | Out-Null
        foreach ($app in @("Editor", "DeviceSelector", "UpdateChecker")) {
          $pdb = "build-$app-${{ matrix.platform }}\release\$app.pdb"
          if (Test-Path $pdb) {
            Move-Item $pdb (Join-Path $symDir "$app.pdb") -Force
          } else {
            Write-Warning "$pdb not found (force_debug_info missing?)"
          }
        }
        $apoPdb = "EqualizerAPO\${{ matrix.platform }}\Release\EqualizerAPO.pdb"
        if (Test-Path $apoPdb) {
          Copy-Item $apoPdb (Join-Path $symDir "EqualizerAPO.pdb") -Force
        }
        Get-ChildItem $symDir

    - name: Upload debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: symbols-${{ matrix.platform }}-${{ matrix.simd_variant }}
        path: symbols/*.pdb

    # Package artifacts
    - name: Package binaries
      shell: pwsh
      run: |
        & "${{ github.workspace }}\.github\scripts\Package-Artifacts.ps1" `
          -WorkspaceRoot "${{ github.workspace }}" `
          -Platform "${{ matrix.platform }}" `
          -SimdVariant "${{ matrix.simd_variant }}"


    # Upload artifacts. Package-Artifacts.ps1 curates the artifact directory
    # (extension filter + Qt-plugin-folder assertion against the manifest's
    # Shared.QtPluginFolders), so the whole directory is the payload; keeping a
    # second folder list here is how generic/ and networkinformation/ went
    # silently missing from releases (audit #275 TD-11).
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: EqualizerAPO-${{ matrix.platform }}-${{ matrix.simd_variant }}
        path: ${{ github.workspace }}\artifacts\EqualizerAPO-${{ matrix.platform }}-${{ matrix.simd_variant }}\
        if-no-files-found: error
        retention-days: 90

  cppcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # cppcheck is built from a pinned release tag instead of apt because the
    # apt package version drifts with the runner image and the finding set
    # changes between cppcheck releases. The gate below must stay reproducible
    # against the same version developers run locally.
    - name: Cache cppcheck
      id: cache-cppcheck
      uses: actions/cache@v6
      with:
        path: ~/cppcheck-install
        key: cppcheck-2.21.0-${{ runner.os }}

    - name: Build cppcheck 2.21.0
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch 2.21.0 https://github.com/danmar/cppcheck.git "$HOME/cppcheck-src"
        cmake -S "$HOME/cppcheck-src" -B "$HOME/cppcheck-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck-install"
        cmake --build "$HOME/cppcheck-build" -j"$(nproc)"
        cmake --install "$HOME/cppcheck-build"

    # The baseline is zero findings and the step fails on any new one.
    # Policy suppressions (kept out of the code on purpose):
    # - cstyleCast/shadow*: Win32/COM/VST interop casts and the upstream
    #   naming style (Qt parent/signal names, ctor parameters named like
    #   members) would mean churn across long-standing upstream code.
    # - useStlAlgorithm/postfixOperator: raw loops and it++ are the house
    #   style inherited from upstream; no behavior or measurable perf impact.
    # - noExplicitConstructor: single-argument constructors (Qt widgets,
    #   exception types, filters) are intentionally implicit upstream.
    # - LocalAllocCalled: LocalAlloc/LocalFree pairs are mandated by the
    #   Win32 security APIs used (SetEntriesInAcl, GetNamedSecurityInfoW).
    # - unknownMacro on the VST3 host files: QUERY_INTERFACE comes from
    #   the VST3 SDK under deps/, which is excluded from analysis.
    # - unusedStructMember on FilterEngine.Process.cpp: the IoTraits label and
    #   I/O members are consumed inside the processImpl member template;
    #   cppcheck does not analyze template instantiations, so it reports every
    #   trait member as unused (false positive).
    # - libHybridConv-0.1.1 (audit #250 F061/F025): the non-building
    #   "pristine" pair was deleted - it had diverged from its own header and
    #   could no longer serve as a reference (maintainer decision 2026-08-09).
    #   The _eapo fork is first-party DSP under active change,
    #   so it is analyzed like the rest of the tree. Its C-style structs are
    #   initialized by hcInitSingle/hcFree by design, hence the scoped
    #   uninitMemberVarNoCtor suppression.
    - name: Run cppcheck
      run: |
        "$HOME/cppcheck-install/bin/cppcheck" \
          --enable=warning,style,performance,portability \
          --inline-suppr \
          --library=qt \
          --library=windows \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --suppress=unmatchedSuppression \
          --suppress=cstyleCast \
          --suppress=shadowFunction \
          --suppress=shadowVariable \
          --suppress=shadowMember \
          --suppress=useStlAlgorithm \
          --suppress=postfixOperator \
          --suppress=noExplicitConstructor \
          --suppress=LocalAllocCalled \
          --suppress=unknownMacro:vst/VSTPluginInstance.cpp \
          --suppress=unknownMacro:vst/VSTPluginInstanceInternal.h \
          --suppress=unknownMacro:vst/VSTPluginLibrary.cpp \
          --suppress=unusedStructMember:engine/FilterEngine.Process.cpp \
          --suppress=uninitMemberVarNoCtor:libHybridConv-0.1.1/* \
          --suppress=*:deps/* \
          --error-exitcode=1 \
          --quiet \
          --std=c++17 \
          -i deps \
          --output-file=cppcheck-report.txt \
          . || failed=1
        echo "--- cppcheck report ---"
        cat cppcheck-report.txt || true
        if [ "${failed:-0}" = "1" ]; then
          line_count=$(wc -l < cppcheck-report.txt)
          echo "::error::cppcheck found new issues (${line_count} lines). Fix them or, for a justified false positive, add an inline or job-level suppression with a rationale."
          exit 1
        fi

    - name: Upload cppcheck report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cppcheck-report
        path: cppcheck-report.txt
        retention-days: 30

  # Dynamic memory gate: the runtime test suites rebuilt with MSVC
  # AddressSanitizer (use-after-free, heap/stack overflow, double free =>
  # the report aborts the process and the step fails) and run with the
  # AlignedMemory leak canary each suite checks at exit
  # (Tests/AlignedMemoryGate.h: a memleak of an engine buffer exits 1).
  # MSVC has no LeakSanitizer on Windows, so full-heap leak detection is
  # not available; the canary covers the engine-buffer class - the
  # original convolution-tail bug class - deterministically instead.
  # Build/run mechanics live in .github/scripts/Invoke-MemcheckTests.ps1.
  memcheck:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Resolve pinned dependency tags
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $manifest = Import-PowerShellDataFile -Path "${{ github.workspace }}\.github\simd-variants.psd1"
        "VST3_TAG=$($manifest.Shared.Vst3Tag)" >> $env:GITHUB_ENV
        "HIGHWAY_TAG=$($manifest.Shared.HighwayTag)" >> $env:GITHUB_ENV
        "TCLAP_TAG=$($manifest.Shared.TclapTag)" >> $env:GITHUB_ENV

    - name: Download dependency release assets
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        Import-Module "${{ github.workspace }}\.github\scripts\Provisioning.psm1" -Force

        $manifest = Import-PowerShellDataFile -Path "${{ github.workspace }}\.github\simd-variants.psd1"
        $downloads = Get-DependencyDownloadSpec -Manifest $manifest `
          -DepsRoot "${{ github.workspace }}\deps" `
          -Platform "x64" `
          -Simd "avx2"
        Invoke-DependencyDownload -Downloads $downloads `
          -DownloadRoot "${{ github.workspace }}\deps\_downloads"

    - name: Download TCLAP
      uses: actions/checkout@v6
      with:
        repository: 115dkk/tclap
        ref: ${{ env.TCLAP_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        path: deps/tclap

    - name: Download VST3 pluginterfaces
      uses: actions/checkout@v6
      with:
        repository: steinbergmedia/vst3_pluginterfaces
        ref: ${{ env.VST3_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        path: deps/vst3sdk/pluginterfaces

    - name: Download Highway
      uses: actions/checkout@v6
      with:
        repository: google/highway
        ref: ${{ env.HIGHWAY_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        path: deps/highway

    - name: Setup dependency structures
      shell: pwsh
      run: |
        .\.github\scripts\Initialize-DepsEnvironment.ps1 -DepsPath "${{ github.workspace }}\deps"

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # EditorLogicTests links Qt6Core/Gui/Widgets; the other suites are Qt-free.
    - name: Install Qt
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        Import-Module "${{ github.workspace }}\.github\scripts\Provisioning.psm1" -Force

        $qtRoot = Install-QtSdk -WorkspaceRoot "${{ github.workspace }}" -Platform "x64"

        echo "QT_ROOT=$qtRoot" >> $env:GITHUB_ENV
        echo "$qtRoot\bin" >> $env:GITHUB_PATH

    # Import-VsDevEnvironment puts the VC toolset bin on PATH, which is where
    # the ASan runtime DLL (clang_rt.asan_dynamic-x86_64.dll) lives.
    - name: Build and run the suites under the memory gate
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        . .\.github\scripts\Import-VsDevEnvironment.ps1
        Import-VsDevEnvironment "x64"
        & "${{ github.workspace }}\.github\scripts\Invoke-MemcheckTests.ps1" `
          -WorkspaceRoot "${{ github.workspace }}"

  pester:
    # Unit-tests the release-keystone scripts the version-bump job runs:
    # Bump-Version.ps1 (the Conventional Commit -> SemVer mapping that decides
    # every release) and Update-Changelog.ps1 (moving the Unreleased entries
    # under the bumped version). Like cppcheck this is an independent gate with
    # no `if:`, so it runs on pull requests too, where the version-bump job is
    # skipped. Pester 5 is pinned for reproducibility the same way the cppcheck
    # version is.
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Pester 5
      shell: pwsh
      run: |
        # Some runner images come up without PSGallery registered (seen
        # 2026-07-09: "No repository with the name 'PSGallery' was found");
        # re-register the defaults before trusting it.
        if ($null -eq (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
          Register-PSRepository -Default
        }
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Install-Module Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser

    - name: Run Bump-Version tests
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        Import-Module Pester -RequiredVersion 5.6.1
        $config = New-PesterConfiguration
        $config.Run.Path = ".github/scripts/Tests"
        $config.Run.Exit = $true
        $config.Output.Verbosity = "Detailed"
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputPath = "pester-results.xml"
        Invoke-Pester -Configuration $config

    - name: Upload Pester results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pester-results
        path: pester-results.xml
        retention-days: 30

  cross-variant-compare:
    needs: [build, prepare-matrix]
    runs-on: ubuntu-latest
    # The PR pipeline only builds AVX2, so there is nothing to compare
    # across variants. The always() guard matters on workflow_dispatch runs:
    # version-bump is skipped there, and GitHub propagates a skip through the
    # needs chain unless the dependent job's condition overrides it - without
    # always() the dispatch validation path silently lost this comparison
    # (first seen on the run validating the arm64 msbuild fix).
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download per-variant audio outputs
      uses: actions/download-artifact@v7
      with:
        pattern: audio-regression-output-*
        path: artifacts

    - name: Install numpy
      # Audit #250 F060: pinned like the rest of the toolchain.
      run: python3 -m pip install --quiet numpy==2.3.2

    - name: Compare SIMD variants
      env:
        # Gating variant list derived from .github/simd-variants.psd1 by
        # New-BuildMatrix.ps1; the script falls back to its hard-coded list
        # (with a warning) only when this variable is absent.
        RUNNER_EXECUTABLE_VARIANTS: ${{ needs.prepare-matrix.outputs.runner_executable_variants }}
      run: python3 Tests/AudioRegressionTests/scripts/cross_variant_compare.py

  create-release:
    needs: [build, version-bump]
    runs-on: windows-2025-vs2026
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    permissions:
      actions: read
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        # Pick up the bumped version.h, not the pre-bump SHA that triggered the run.
        ref: ${{ needs.version-bump.outputs.bumped_sha || github.sha }}

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: EqualizerAPO-*
        path: ${{ github.workspace }}\release-input

    # MSBuild for the x86 auto-detect installer built in this job (the matrix
    # builds the per-variant binaries; this front-door installer is a single
    # architecture-agnostic binary built once here).
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Resolve release version
      id: version
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Canonical version.h reader, shared with the version-bump job.
        . .\.github\scripts\Get-VersionPart.ps1

        $major = Get-VersionPart "MAJOR"
        $minor = Get-VersionPart "MINOR"
        $revision = Get-VersionPart "REVISION"
        $baseVersion = "$major.$minor.$revision"
        # Clean SemVer release version (no -main.<run> prerelease suffix). version-bump
        # already advances version.h per main push, so the base version is unique enough,
        # and GitHub publishes a tag without a prerelease identifier as a full release.
        $packVersion = $baseVersion
        $tag = "v$packVersion"

        "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
        "pack_version=$packVersion" >> $env:GITHUB_OUTPUT
        "tag=$tag" >> $env:GITHUB_OUTPUT
        .\.github\scripts\Publish-Release.ps1 `
          -Repository "${{ github.repository }}" `
          -Tag $tag `
          -PackVersion $packVersion

        Write-Host "Base version: $baseVersion"
        Write-Host "Release version: $packVersion"
        Write-Host "Release tag: $tag"

    - name: Create source archive
      if: steps.version.outputs.needs_source == 'true'
      shell: pwsh
      run: |
        Import-Module .\.github\scripts\ReleaseAssets.psm1
        $sourceZip = Join-Path "${{ github.workspace }}" (Get-SourceZipAssetName -PackVersion "${{ steps.version.outputs.pack_version }}")
        # Archive the explicit release SHA (the bumped commit), not HEAD:
        # HEAD is only correct because the checkout step above happens to use
        # the same ref, and a drift there would silently ship pre-bump source
        # (audit #275 TD-13).
        git archive --format=zip --output="$sourceZip" "${{ needs.version-bump.outputs.bumped_sha || github.sha }}"
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
        if (-not (Test-Path $sourceZip)) {
          Write-Error "Source archive was not created"
          exit 1
        }
        Write-Host "Created source archive: $sourceZip"

    - name: Create Velopack release
      if: steps.version.outputs.missing_channels != '' || steps.version.outputs.needs_source == 'true'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $missingChannels = @("${{ steps.version.outputs.missing_channels }}".Split(
          ',', [System.StringSplitOptions]::RemoveEmptyEntries))
        .\.github\scripts\New-VelopackRelease.ps1 `
          -Repository "${{ github.repository }}" `
          -Tag "${{ steps.version.outputs.tag }}" `
          -PackVersion "${{ steps.version.outputs.pack_version }}" `
          -TargetCommit "${{ github.sha }}" `
          -WorkspaceRoot "${{ github.workspace }}" `
          -MissingChannels $missingChannels `
          -NeedsSource:("${{ steps.version.outputs.needs_source }}" -eq "true")

    - name: Build and publish auto-detect installer
      if: steps.version.outputs.needs_installer == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # EqualizerAPO-XT-Setup.exe is the x86 front-door installer: it detects the
        # CPU (architecture + AVX level) and downloads/runs the matching per-channel
        # Setup. It has no external dependencies, so it builds standalone here.
        # See docs/AutoDetectInstaller.md.
        $tag = "${{ steps.version.outputs.tag }}"

        # Asset name from the grammar module, not a fourth literal spelling
        # (audit #275 TD-14). ReleaseAssets.Tests.ps1 keeps the vcxproj
        # TargetName and the .rc OriginalFilename aligned with the grammar.
        Import-Module .\.github\scripts\ReleaseAssets.psm1
        $assetName = Get-UniversalSetupAssetName

        # Reputation preservation: the binary resolves /releases/latest, so it
        # only truly changes when its inputs change. When they have not, ship
        # the previous release's exact bytes - Defender/SmartScreen reputation
        # is per file hash, and an unsigned binary that re-hashes every release
        # restarts at zero reputation every time (the Wacatac.B!ml reports).
        # Any anomaly falls back to a fresh build. See the script's header.
        # gh release upload names the asset after the local file, so the
        # reused copy must carry the canonical asset name. v2.39.0 first
        # exercised this path and shipped the front door as
        # "reused-EqualizerAPO-XT-Setup.exe" because the prefix was spelled
        # into the file name; a subdirectory keeps the copy apart instead.
        $reuseDir = Join-Path "${{ github.workspace }}" "reused-installer"
        New-Item -ItemType Directory -Force -Path $reuseDir | Out-Null
        $reusePath = Join-Path $reuseDir $assetName
        $decision = .\.github\scripts\Get-PreviousInstallerAsset.ps1 `
          -Repository "${{ github.repository }}" `
          -Tag $tag `
          -ReleaseSha "${{ needs.version-bump.outputs.bumped_sha || github.sha }}" `
          -AssetName $assetName `
          -OutputPath $reusePath
        Write-Host ("Installer reuse decision: reuse={0} previous='{1}' ({2})" -f `
          $decision.Reuse, $decision.PreviousTag, $decision.Reason)

        if ($decision.Reuse) {
          $setupExe = $reusePath
        }
        else {
          msbuild Installer\Installer.vcxproj `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $setupExe = Join-Path "${{ github.workspace }}\Installer\Release" $assetName
        }

        if (-not (Test-Path $setupExe)) {
          Write-Error "Auto-detect installer was not produced at $setupExe"
          exit 1
        }
        if ((Split-Path $setupExe -Leaf) -ne $assetName) {
          Write-Error "Installer file '$setupExe' must be named '$assetName'; gh release upload names the asset after the local file"
          exit 1
        }

        gh release upload $tag $setupExe --clobber --repo "${{ github.repository }}"
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    # The auto-detect installer refuses to run a downloaded per-channel Setup.exe
    # whose SHA-256 does not match this file (Installer/AutoInstaller.cpp), so it
    # must list every *-Setup.exe asset and be uploaded to the same release. The
    # assets are re-downloaded from the release rather than hashed from local
    # build directories so the hashes cover exactly the bytes users will get.
    - name: Publish release checksums
      if: steps.version.outputs.needs_checksums == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        .\.github\scripts\New-ReleaseChecksums.ps1 `
          -Repository "${{ github.repository }}" `
          -Tag "${{ steps.version.outputs.tag }}" `
          -WorkspaceRoot "${{ github.workspace }}"

    - name: Write release notes
      if: steps.version.outputs.needs_notes == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $notesPath = "${{ github.workspace }}\release-notes.md"
        .\.github\scripts\New-ReleaseNotes.ps1 `
          -Repository "${{ github.repository }}" `
          -Tag "${{ steps.version.outputs.tag }}" `
          -PackVersion "${{ steps.version.outputs.pack_version }}" `
          -WorkflowRunId "${{ github.run_id }}" `
          -TargetCommit "${{ github.sha }}" `
          -OutputPath $notesPath
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        # --prerelease=false: the clean X.Y.Z tag is a full release; make sure vpk's
        # upload (which may default to prerelease) does not leave it marked as one.
        gh release edit "${{ steps.version.outputs.tag }}" `
          --repo "${{ github.repository }}" `
          --notes-file $notesPath `
          --prerelease=false `
          --latest
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    # Every step above is gated on a `needs_*` output consumed as a string, so
    # a renamed output would skip its step while the job stays green (audit
    # #275 TD-09). Re-running the planner and demanding a complete release
    # turns that whole failure class into a job failure.
    - name: Assert release completeness
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $plan = .\.github\scripts\Publish-Release.ps1 `
          -Repository "${{ github.repository }}" `
          -Tag "${{ steps.version.outputs.tag }}" `
          -PackVersion "${{ steps.version.outputs.pack_version }}" `
          -PassThru
        if (-not $plan.Complete) {
          throw ("Release ${{ steps.version.outputs.tag }} is incomplete after the release steps ran: " +
            "missing channels='$($plan.MissingChannels -join ',')', " +
            "needsSource=$($plan.NeedsSource), needsInstaller=$($plan.NeedsInstaller), " +
            "needsChecksums=$($plan.NeedsChecksums), needsNotes=$($plan.NeedsNotes). " +
            "A release step was skipped or its outputs drifted; see Publish-Release.ps1.")
        }
        Write-Host "Release ${{ steps.version.outputs.tag }} is complete."
