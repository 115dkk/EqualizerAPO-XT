<!-- @dsCard group="Badges" height=580 width=960 subtitle="Command type badges (6 types + disabled) and channel badges (identity colours, ALL, a virtual VC), five skins" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TypeBadge — preview</title>
<style>
  html, body { margin: 0; background: transparent; }
  .line { display: flex; align-items: center; gap: 10px; padding: 6px 0 6px 12px; }
  .cap { min-width: 64px; font-size: 10.67px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .b { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 20px; }
  .b svg { width: 16px; height: 16px; display: block; }
  /* channel badges (ChBadge): the identity colour as ink and line, a tinted fill; ALL and unknown channels are
     channel-neutral; a virtual channel (one the device does not have; a 7.1 device is assumed) is dashed */
  .ch { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 16px; padding: 0 5px; box-sizing: border-box;
    font-family: var(--font); font-size: 11.5px; font-weight: 700; line-height: 1; color: var(--c); border: 1px solid var(--c); }
  .ch.virt { border-style: dashed; background: color-mix(in srgb, var(--c) 14%, transparent); }
  [data-theme="light"] .ch.virt { background: color-mix(in srgb, var(--c) 9%, transparent); }
  .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

  /* ===== Studio: lit glass chips; BiQuad wears the band light, others the command ink ===== */
  .skin-studio .b { color: var(--t); background: color-mix(in srgb, var(--t) 15%, transparent); border: 1px solid color-mix(in srgb, var(--t) 42%, transparent); border-radius: var(--radius); }
  [data-theme="light"] .skin-studio .b { background: color-mix(in srgb, var(--t) 10%, transparent); border-color: color-mix(in srgb, var(--t) 45%, transparent); }
  .skin-studio .b.off { color: var(--muted); background: transparent; border-color: color-mix(in srgb, var(--muted) 42%, transparent); }
  .skin-studio .ch:not(.virt), .skin-soft .ch:not(.virt) { background: color-mix(in srgb, var(--c) 27%, transparent); }
  [data-theme="light"] .skin-studio .ch:not(.virt), [data-theme="light"] .skin-soft .ch:not(.virt) { background: color-mix(in srgb, var(--c) 19%, transparent); }
  .skin-studio .ch, .skin-soft .ch { border-radius: 999px; }
  /* ===== Minimal: outline only, ink = type colour; glyph carries the form ===== */
  .skin-minimal .b { color: var(--t); border: 1px solid var(--t); border-radius: 0; }
  .skin-minimal .b.off { color: var(--muted); border-color: var(--muted); }
  .skin-minimal .ch { color: var(--c); padding: 0 2px; border: 0; background: none; font-family: var(--mono); font-size: 12.67px; }
  .skin-minimal .ch.virt { border: 1px dashed var(--c); }
  /* ===== Soft: pastel stadium chips (softPastelize of the type hue) with warm on-ink ===== */
  .skin-soft .b { width: 28px; height: 22px; border-radius: 999px; color: var(--on-accent); background: var(--p); }
  .skin-soft .b.off { background: transparent; color: var(--muted); border: 1px dotted var(--muted); }
  /* ===== Rack: wireframe printed on the plate, pictogram in type ink ===== */
  .skin-rack .b { color: var(--t); border: 1px solid var(--t); border-radius: 2px; }
  .skin-rack .b.off { opacity: .45; color: var(--muted); border-color: var(--muted); }
  .skin-rack .ch, .skin-matrix .ch { border-radius: var(--radius); }
  .skin-rack .ch:not(.virt), .skin-matrix .ch:not(.virt) { background: color-mix(in srgb, var(--c) 14%, transparent); }
  [data-theme="light"] .skin-rack .ch:not(.virt), [data-theme="light"] .skin-matrix .ch:not(.virt) { background: color-mix(in srgb, var(--c) 9%, transparent); }
  /* ===== Matrix: monochrome code cells; the type colour is ignored on purpose ===== */
  .skin-matrix .b { color: var(--text); border: 1px solid var(--text); border-radius: 0; background: var(--bg); }
  .skin-matrix .b.off { color: var(--muted); border: 1px dotted var(--muted); }

  /* type inks (t) and pastel shelf values (p): hue kept, saturation capped at .50/.55, lightness .62/.60 */
  .t-biquad { --t: var(--type-biquad); --p: hsl(142 50% 62%); } .skin-studio .t-biquad { --t: var(--accent); }
  .t-include { --t: var(--type-include); --p: hsl(215 16% 62%); }
  .t-vst { --t: var(--type-vst); --p: hsl(271 50% 62%); }
  .t-copy { --t: var(--type-copy); --p: hsl(189 50% 62%); }
  .t-comment { --t: var(--type-comment); --p: hsl(215 20% 62%); }
  .t-if { --t: var(--type-if); --p: hsl(350 50% 62%); }
  [data-theme="light"] .t-biquad { --p: hsl(142 55% 60%); } [data-theme="light"] .t-include { --p: hsl(215 16% 60%); }
  [data-theme="light"] .t-vst { --p: hsl(271 55% 60%); } [data-theme="light"] .t-copy { --p: hsl(189 55% 60%); }
  [data-theme="light"] .t-comment { --p: hsl(215 20% 60%); } [data-theme="light"] .t-if { --p: hsl(350 55% 60%); }
  .c-l { --c: var(--channel-l); } .c-r { --c: var(--channel-r); } .c-c { --c: var(--channel-c); } .c-lfe { --c: var(--channel-lfe); }
  .c-sl { --c: var(--channel-sl); } .c-sr { --c: var(--channel-sr); } .c-all { --c: var(--channel-neutral); }
  .skin-minimal .c-l { --c: var(--minimal-ch-l); } .skin-minimal .c-r { --c: var(--minimal-ch-r); } .skin-minimal .c-c { --c: var(--minimal-ch-c); }
  .skin-minimal .c-lfe { --c: var(--minimal-ch-lfe); } .skin-minimal .c-sl { --c: var(--minimal-ch-sl); } .skin-minimal .c-sr { --c: var(--minimal-ch-sr); }
  .skin-minimal .c-all { --c: var(--minimal-ch-neutral); }
</style>
</head>
