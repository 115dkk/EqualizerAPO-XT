<!-- @dsCard group="Rows" height=1290 width=960 subtitle="The Copy row body: light traces, step list, formula blocks, patchbay button field, crosspoint grid" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CopyRouting — preview</title>
<style>
  html, body { margin: 0; background: transparent; }

  .cbody { position: relative; }
  .pill { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 20px; padding: 0 7px; font-family: var(--mono); font-size: 11px; font-weight: 700; border-radius: 999px;
    color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); }
  .pill.virt { border-style: dotted; }
  .pill.ghost { color: var(--muted); border: 1px dotted var(--muted); background: transparent; }
  /* studio: light traces etched on the glass between the input row and the output row */
  .lt { position: relative; height: 118px; width: 220px; }
  .lt .pill { position: absolute; }
  .lt svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .lt .fac { position: absolute; font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--text); background: var(--sunken); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  /* minimal: the numbered step list, a console session */
  .steps { font-family: var(--mono); font-size: 12px; }
  .steps .r { display: flex; align-items: center; height: 26px; gap: 8px; }
  .steps .r.h { color: var(--muted); font-size: 10.67px; letter-spacing: 1px; height: 22px; }
  .steps .no { width: 28px; color: var(--muted); border-right: 1px solid var(--border); height: 100%; display: inline-flex; align-items: center; }
  .steps .tok { font-weight: 700; color: var(--c); }
  .steps .tok.virt { border: 1px dotted var(--c); padding: 0 4px; }
  .steps .fx { border: 1px solid var(--border); padding: 0 4px; color: var(--muted); font-size: 11px; }
  .steps .tgt { border: 1px solid var(--border); padding: 0 5px; color: var(--muted); font-size: 11px; }
  .steps .cur { display: inline-block; width: 7px; height: 13px; background: var(--accent); }
  /* soft: formula blocks */
  .blk { position: relative; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 20px; margin-bottom: 8px; border-radius: 12px; background: var(--card); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .blk::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 4px; border-radius: 2px; background: var(--c); }
  .blk .dst { font-weight: 700; color: var(--c); font-family: var(--mono); }
  .blk .op { color: var(--muted); }
  .blk .term { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--on-accent); background: var(--c); }
  .blk .term.q { background: transparent; color: var(--c); border: 1px solid var(--c); }
  .blk .add, .addch { display: inline-flex; align-items: center; justify-content: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px dotted var(--muted); color: var(--muted); font-size: 12px; }
  /* rack: the routing matrix button field on a sunken sub-panel */
  .field { display: inline-block; padding: 12px 16px 12px 12px; border-radius: 3px; background: color-mix(in srgb, var(--card) 60%, black); box-shadow: inset 0 3px 4px rgba(0,0,0,.65), inset 0 -1px 0 rgba(255,255,255,.08); }
  .field table { border-collapse: separate; border-spacing: 6px 6px; }
  .field th { font-size: 9px; letter-spacing: 1.5px; font-weight: 700; color: var(--c); text-transform: uppercase; padding: 0 4px; }
  .field .capb { width: 44px; height: 28px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #2c333a, #1b2126); border: 1px solid #11161a; border-top-color: #3e474f; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); }
  [data-theme="light"] .field .capb { background: linear-gradient(180deg, var(--card-hover), var(--card)); border-color: var(--seam); }
  .field .capb.on { border-color: var(--accent); background: linear-gradient(180deg, #1b2126, #2c333a); box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 0 4px color-mix(in srgb, var(--accent) 40%, transparent); }
  .field .capb .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 5px var(--accent); }
  .field .capb .dimple { width: 3px; height: 3px; border-radius: 50%; background: rgba(0,0,0,.7); box-shadow: 0 1px 0 rgba(255,255,255,.08); }
  .field .addcap { margin-top: 8px; height: 24px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 3px; background: linear-gradient(180deg, #2c333a, #1b2126); border: 1px solid #11161a; border-top-color: #3e474f; font-size: 9px; letter-spacing: 1px; font-weight: 700; color: var(--text); }
  /* matrix: the crosspoint grid */
  .grid { border-collapse: separate; border-spacing: 4px; font-family: var(--mono); font-size: 11.5px; font-weight: 700; }
  .grid .hd { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 18px; color: var(--on-accent); background: var(--c); font-size: 10.67px; letter-spacing: 1px; }
  .grid .hd.virt { background: transparent; color: var(--c); border: 1px dotted var(--c); }
  .grid .rh { justify-content: center; }
  .grid .cell { width: 52px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--graph); color: var(--text); }
  .grid .cell.acc { border-color: var(--accent); color: var(--accent); }
  .grid .cell.one { border-color: var(--success); color: var(--success); }
  .mbus { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px solid var(--border); background: var(--graph); color: var(--muted); font-family: var(--mono); font-weight: 700; font-size: 10.67px; letter-spacing: 1px; margin-top: 6px; }

</style>
</head>
