<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="rack.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EQ APO-XT · Rack</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="cabinet">
      <header class="master-rail">
        <span class="rail-mark">MASTER</span>
        <div class="rail-controls">
          <button id="btn-sample" class="rk-btn">LOAD</button>
          <button id="btn-parse" class="rk-btn rk-btn-accent">PARSE</button>
          <button id="btn-finish" class="rk-btn" title="dark / cream finish">FINISH</button>
          <span class="rail-led" id="power-led" title="POWER"></span>
        </div>
      </header>

      <section class="monitor-bay">
        <div class="bay-label">SPECTRUM MONITOR</div>
        <canvas id="monitor" class="monitor-canvas"></canvas>
      </section>

      <section id="rack" class="rack" aria-label="filter units"></section>

      <details class="config-drawer">
        <summary>config.txt</summary>
        <textarea id="config-input" spellcheck="false" placeholder="Equalizer APO config — LOAD로 샘플을 넣거나 붙여넣고 PARSE"></textarea>
      </details>

      <footer class="status" id="status">준비됨</footer>
    </div>
  </body>
</html>
